name: Maintenance pass 2026-11-12 00:00 (one-shot)

# One-shot applier for the 2026-11-12 00:00 IST geolocation pass. The pass's
# own environment could read this repository but not write to it (git push
# returns 403), so the change is staged as a patch and applied, built, checked
# and committed here, with the repository's own write token. This file and the
# patch are removed in the commit it pushes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Apply the pass, build and verify
        run: |
          set -e -o pipefail
          PATCH=maint-pass-2026-11-12-0000.patch
          git apply --check "$PATCH"
          git apply "$PATCH"
          echo "patch applied"
          cp web/index.html android/assets/index.html
          cmp -s web/index.html android/assets/index.html
          python3 - <<'PY'
          import re
          s = open('web/index.html', encoding='utf-8').read()
          open('/tmp/page.js', 'w', encoding='utf-8').write(re.search(r'<script>(.*)</script>', s, re.S).group(1))
          PY
          node --check /tmp/page.js
          chmod +x android/build.sh
          ./android/build.sh
          cp android/build/LiquidWeather.apk LiquidWeather.apk
          NEW=$(sha256sum LiquidWeather.apk | cut -d' ' -f1)
          python3 - "$NEW" <<'PY'
          import re, sys
          p = 'CHECKSUMS.txt'
          s = open(p, encoding='utf-8').read()
          out = re.sub(r'^[0-9a-f]{64}  LiquidWeather\.apk$',
                       sys.argv[1] + '  LiquidWeather.apk', s, flags=re.M)
          assert out != s or sys.argv[1] in s, 'no digest line in CHECKSUMS.txt'
          open(p, 'w', encoding='utf-8').write(out)
          PY
          python3 .github/scripts/verify_apk.py .
          grep -E '^[0-9a-f]{64}  LiquidWeather\.apk$' CHECKSUMS.txt | sha256sum -c -

      - name: Commit the pass
        run: |
          set -e -o pipefail
          git rm -q .github/workflows/maint-pass-2026-11-12-0000.yml maint-pass-2026-11-12-0000.patch
          git config user.name "Liquid Weather maintenance"
          git config user.email "maintenance@liquidweather.app"
          git add -A
          git commit -q -F - <<'MSG'
          fix(geo): merge the saved copy of the place the location path lands on

          Two rows for one place, both reachable without unusual state.

          A refused prompt (or a device with no GPS, or the 15s watchdog) fills the
          pinned "My Location" row with New Delhi, but first looks for a saved New Delhi
          to merge it into — and that lookup compared ids with a string written out by
          hand, 'c28.6139,77.2090' (four decimals), while every other place is keyed by
          pid() at three ('c28.614,77.209'). The only row it could ever recognise was one
          an earlier fallback had written itself, so a New Delhi saved from search was not
          found and the list showed "New Delhi" twice, costing one of the five slots.

          dropTwin() had the same shape: ids only. The device's fix for Mumbai (19.0550,
          72.8692) is 2.4 km from the bundled Mumbai a reader saved (19.076, 72.8777), so
          the keys differ, nothing merged, and "Use my current location" in the city you
          had already saved left it listed twice.

          Both lookups now use samePlace() — same key, or the same name within 25 km — the
          rule addPlace(), row() and repairSaved() have always used; the fallback row is
          keyed with pid() like every other place; and because the pinned row is still
          called "My Location" until the geocoder answers, locate() applies the merge once
          more when the name arrives, on both the on-time and the late-name paths. No
          visible change: #main is byte-identical to 1.9 in every scenario checked.

          versionCode 61 / versionName 1.9.1, android/assets/index.html resynced, APK
          rebuilt (verify_apk.py agrees on page and version), CHECKSUMS.txt updated.
          MSG
          git push origin HEAD:main
