name: Maintenance pass 2026-11-09 (one-shot)

# Applies the network pass staged in .maint/, builds the APK from the patched
# sources, checks the bundled copy and the signer, updates CHECKSUMS/README/
# CHANGELOG, then commits the result and pushes it to main. It deletes itself
# and .maint/ in that same commit, so nothing of it stays in the tree.

on:
  workflow_dispatch:
  push:
    branches: [ 'maint/2026-11-09-area1' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/2026-11-09-area1
          fetch-depth: 0

      - name: Keep the commit message
        run: cp .maint/commitmsg.txt /tmp/msg.txt

      - name: Apply the fix
        run: python3 .maint/apply.py prepare

      - name: Syntax check the extracted script
        run: node --check /tmp/extracted.js && echo "script parses"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        run: |
          chmod +x android/build.sh
          ./android/build.sh

      - name: Finish (checksums, APK/source parity, tidy up)
        run: python3 .maint/apply.py finish

      - name: Commit
        run: |
          git config user.name "Liquid Weather maintenance"
          git config user.email "maintenance@liquidweather.app"
          git add -A
          git commit -F /tmp/msg.txt
          git show --stat --oneline HEAD | head -20

      - name: Push to main
        run: |
          if git push origin HEAD:main; then
            echo "pushed to main"
          else
            echo "::warning::push to main was refused; the commit is on the staging branch"
            git push origin HEAD:maint/2026-11-09-area1 || true
            exit 1
          fi
