name: Maintenance pass (one-shot, digest)

# Records the digest of the APK the previous one-shot job published. Staged for
the same reason: the maintenance environment cannot write to this repository.

on:
  push:
    branches: [ main ]
    paths:
      - '.maint/fix_digest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[maint-digest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the digest
        run: |
          python3 .maint/fix_digest.py
          grep -n '29fc7bc8' CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name "Liquid Weather Maintenance"
          git config user.email "maintenance@liquidweather.app"
          git add -A
          git commit -m "docs(changelog): record the digest of the APK this pass published"
          git push origin HEAD:main
