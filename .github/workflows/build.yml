name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CHECKSUMS.txt is the only thing that tells a downloader which APK is the
      # published one, and nothing used to read it: a pass could commit a rebuilt
      # LiquidWeather.apk and leave the old digest in place, and the repo would go
      # on advertising a checksum that fails for every download. Check it here,
      # before anything is built, so the mismatch fails CI instead of a user.
      - name: Verify CHECKSUMS.txt describes the committed APK
        run: |
          grep -E '^[0-9a-f]{64}  LiquidWeather\.apk$' CHECKSUMS.txt | sha256sum -c -

      # The checksum above only proves the committed APK is the file the digest
      # was taken from — a stale APK has a perfectly valid checksum of its own.
      # Nothing compared the APK itself with the sources it claims to be built
      # from, so two real failures went unnoticed: an APK bundling an older
      # assets/index.html than web/index.html (the 1.8.4 APK carried 1.8.3's
      # page), and an APK whose versionCode/versionName disagreed with
      # AndroidManifest.xml after a bump that was never rebuilt. Both are
      # checked here, before the build, so a release cannot publish an app that
      # is not the one in the repository.
      - name: Verify the committed APK matches the sources
        run: python3 .github/scripts/verify_apk.py .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship an Android SDK; just add the
      # platform + build-tools this project needs.
      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        run: |
          chmod +x android/build.sh
          ./android/build.sh

      # CI builds the APK to prove the committed sources build. The published
      # release asset is the maintainer's build of the same source, so its
      # SHA-256 matches CHECKSUMS.txt (byte-for-byte identical builds aren't
      # possible here: apksigner stamps zip entries with the current time).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidWeather-apk
          path: android/build/LiquidWeather.apk
