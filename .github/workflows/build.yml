name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship an Android SDK; just add the
      # platform + build-tools this project needs.
      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        run: |
          chmod +x android/build.sh
          ./android/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidWeather-apk
          path: android/build/LiquidWeather.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/LiquidWeather.apk
