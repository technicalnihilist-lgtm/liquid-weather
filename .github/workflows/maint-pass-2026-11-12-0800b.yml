name: Maintenance pass 2026-11-12 08:00 docs (one-shot)

# One-shot applier for the documentation half of the 2026-11-12 08:00 IST build
# & release hygiene pass. The pass's own environment could read this repository
# but not write to it (git push returns 403), so the change is applied, checked
# and committed here, with the repository's own write token. It deliberately
# touches no workflow file: the app's token has no `workflows` permission, so
# `.github/workflows/build.yml` is committed separately through the connector.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the pass
        run: |
          set -e -o pipefail

          cat > .github/scripts/verify_docs.py <<'PY'
          #!/usr/bin/env python3
          """Check that the checksum README.md hands a downloader is the published one.

          The install instructions in ``README.md`` end with a copy-paste verification::

              sha256sum LiquidWeather.apk
              # 042f58b6…

          That digest is a *third* copy of the same value — ``CHECKSUMS.txt`` has one and
          the committed ``LiquidWeather.apk`` is the file both describe — and nothing ever
          read it. ``CHECKSUMS.txt`` is checked by ``.github/workflows/build.yml`` and the
          APK is checked against the sources by ``verify_apk.py``, so both of those could
          be perfectly current while the README still told every reader to expect an older
          build's digest. It did: through seven releases (1.8, 1.8.1 … 1.9) the README
          kept advertising ``f8a52080…``, the 1.7 APK, so a reader who followed the
          instructions got

              LiquidWeather.apk: FAILED

          on a download that was exactly the file the repository publishes. A checksum
          that fails on a good file is worse than no checksum: it reads as a corrupted or
          tampered download.

          ``CHECKSUMS.txt`` cannot catch this, because it says nothing about what the
          README prints; neither can ``verify_apk.py``, which never opens the README.

          Usage: verify_docs.py [repo-root]   (defaults to the current directory)
          Exit status 0 when the README, CHECKSUMS.txt and the APK agree, 1 when they do
          not.
          """

          import hashlib
          import os
          import re
          import sys

          README = "README.md"
          CHECKSUMS = "CHECKSUMS.txt"
          APK = "LiquidWeather.apk"

          DIGEST = re.compile(r"\b[0-9a-f]{64}\b")
          # The fenced block that holds the verification instructions, and the digest line
          # inside it (`# 042f58b6…`, the output of the command above it).
          README_BLOCK = re.compile(r"```[^\n]*\n(.*?)```", re.S)
          README_LINE = re.compile(r"^[ \t]*#?[ \t]*([0-9a-f]{64})[ \t]*$", re.M)
          CHECKSUMS_LINE = re.compile(r"^([0-9a-f]{64})  LiquidWeather\.apk$", re.M)


          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for block in iter(lambda: fh.read(1 << 16), b""):
                      h.update(block)
              return h.hexdigest()


          def main(argv):
              root = argv[1] if len(argv) > 1 else "."

              readme_path = os.path.join(root, README)
              checksums_path = os.path.join(root, CHECKSUMS)
              apk_path = os.path.join(root, APK)
              for path in (readme_path, checksums_path, apk_path):
                  if not os.path.isfile(path):
                      print("ERROR: %s is missing." % path, file=sys.stderr)
                      return 1

              readme = open(readme_path, encoding="utf-8").read()
              checksums = open(checksums_path, encoding="utf-8").read()

              failures = []

              apk_digest = sha256(apk_path)
              advertised = CHECKSUMS_LINE.search(checksums)
              if not advertised:
                  failures.append("%s carries no digest line for %s." % (CHECKSUMS, APK))
                  checksums_digest = None
              else:
                  checksums_digest = advertised.group(1)
                  if checksums_digest != apk_digest:
                      failures.append(
                          "%s advertises %s for %s but the committed file is %s."
                          % (CHECKSUMS, checksums_digest, APK, apk_digest)
                      )

              printed = []
              for block in README_BLOCK.findall(readme):
                  if "sha256sum %s" % APK in block:
                      printed.extend(README_LINE.findall(block))
              if not printed:
                  failures.append(
                      "%s prints no `sha256sum %s` digest, so a downloader has nothing to\n"
                      "       compare against; the install instructions must show one." % (README, APK)
                  )
                  readme_digest = None
              else:
                  readme_digest = printed[0]
                  if len(set(printed)) > 1:
                      failures.append(
                          "%s prints more than one digest for %s (%s); only the published\n"
                          "       one may appear." % (README, APK, ", ".join(sorted(set(printed))))
                      )
                  # Every other 64-hex value in the README is a stale digest left behind by
                  # an edit that changed the line but not the prose around it.
                  strays = sorted({d for d in DIGEST.findall(readme) if d != readme_digest})
                  if strays:
                      failures.append(
                          "%s still prints %d other digest(s) (%s).\n"
                          "       Only the published APK's digest belongs in the install instructions."
                          % (README, len(strays), ", ".join(strays))
                      )
                  if readme_digest != apk_digest:
                      failures.append(
                          "%s tells the reader to expect %s but the published %s is %s.\n"
                          "       Anyone following the instructions sees 'FAILED' on a good download."
                          % (README, readme_digest, APK, apk_digest)
                      )

              print("APK       : %s" % apk_digest)
              print("CHECKSUMS : %s" % (checksums_digest or "none"))
              print("README    : %s" % (readme_digest or "none"))

              for message in failures:
                  print("ERROR: " + message, file=sys.stderr)
              if failures:
                  return 1
              print("OK: the README advertises the digest of the APK this repository publishes.")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          PY

          cat > /tmp/entry.txt <<'ENTRY'
          ### Fixed — build & release hygiene (2026-11-12, 08:00 IST pass)
          - **The install instructions told every downloader to expect an older build's
            checksum.** The verification block in `README.md` printed `f8a52080…` — the
            1.7 APK — while `CHECKSUMS.txt`, the committed `LiquidWeather.apk` and every
            release since 1.8 carried `042f58b6…` (the 1.9.1 build). A reader who ran the
            two commands exactly as printed got `LiquidWeather.apk: FAILED` on a download
            that was precisely the file this repository publishes, and a checksum that
            fails on a good file reads as a corrupted or tampered download — worse than
            printing none. The block now prints the digest of the committed APK, the same
            value as `CHECKSUMS.txt`, and nothing else in the README prints a digest.
          - **The version and size the same docs advertise had drifted too.** `README.md`
            said `Latest APK: v1.7` (the latest release is v1.9) and "93 KB";
            `STORE.md` said everything in it "matches the current release, `v1.2`" and
            quoted 65 KB in three places, including the short description a store would
            publish. The committed APK is 99,176 bytes (97 KB). Both files now name v1.9
            and 97 KB.
          - **Why it cannot drift again:** a new `.github/scripts/verify_docs.py` reads
            the digest out of the README's `sha256sum LiquidWeather.apk` block and
            requires it to equal both `CHECKSUMS.txt`'s digest and the SHA-256 of the
            committed APK; a README with no digest, with two different digests, or with a
            stray digest left in the prose fails the build. `.github/workflows/build.yml`
            runs it next to the existing `CHECKSUMS.txt` and `verify_apk.py` steps, before
            anything is built. This is the third copy of one value — `CHECKSUMS.txt` and
            the APK were already checked, the README never was — which is the same defect
            family as the duplicate-version and stale-asset checks added on 10 November.

          ### Notes
          - No page change: `web/index.html` is byte-identical to 1.9.1 (SHA-256
            `d3902694…`), so there is no APK rebuild, no `versionCode` bump and no
            `CHECKSUMS.txt` change on this pass; the day's release is still cut from the
            22:00 IST pass.
          - Verified: `node --check` on the page's script; a headless Chromium load of
            `web/index.html` with mocked forecast, geocoder, Commons and image responses
            reporting **zero console errors and zero page errors**, with the hero
            rendering the mocked 29°; `python3 .github/scripts/verify_docs.py .` on this
            tree (exit 0); the same script against the pre-fix README (exit 1, naming
            `f8a52080…` against the published `042f58b6…`) and against a deliberately
            stale `CHECKSUMS.txt` (exit 1); and the reader's own command,
            `sha256sum -c` with 1.7's digest, reporting `FAILED` — the symptom this pass
            removes.
          - Left alone deliberately: (1) **the "97 KB" figure stays a hand-written
            number.** It is prose, and a machine check would fail CI on every rebuild that
            moves the size by a kilobyte — for a value nobody verifies, unlike the
            digest. (2) **The `Latest APK: vX.Y` label stays manual.** It names the newest
            *release*, which legitimately differs from the manifest's unreleased
            `versionName` (1.9.1 against 1.9), and the workflow cannot see tags at
            `fetch-depth: 1`, so any check would either be wrong or need a fetch this pass
            is not entitled to add. (3) **`CHANGELOG.md`'s own ordering.** `[Unreleased]`
            sits between 1.8.8 and 1.9 rather than at the top, so the newest entry is not
            where a reader looks first; reordering 3,300 lines of release history is not
            something one hygiene pass should risk, and it is written down here instead.

          ENTRY

          python3 - <<'PY'
          import pathlib

          OLD = 'f8a52080f036b27e78b7d45224e0dcf0e986b8b9e4d15a0867078b878d00214c'
          NEW = '042f58b64f98086b83307a1e49d0515787003f7aa5444151494ae56e44d9f2f5'

          # README: the latest release label, the advertised size and the digest a
          # downloader is told to compare against.
          p = pathlib.Path('README.md')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('**Latest APK:** [v1.7]', '**Latest APK:** [v1.9]'),
              ('** (93 KB) from this repo', '** (97 KB) from this repo'),
              ('# ' + OLD, '# ' + NEW),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # STORE.md: the release it claims to match, and the size it quotes three
          # times (the table, the short description and the full description).
          p = pathlib.Path('STORE.md')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('release, `v1.2`.', 'release, `v1.9`.'),
              ('| **APK size** | 65 KB |', '| **APK size** | 97 KB |'),
              ('no tracking. 65 KB.', 'no tracking. 97 KB.'),
              ('The APK is 65 KB,', 'The APK is 97 KB,'),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # CHANGELOG: a dated entry at the top of the Unreleased block.
          p = pathlib.Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          entry = pathlib.Path('/tmp/entry.txt').read_text(encoding='utf-8')
          marker = "## [Unreleased]\n\n"
          assert s.count(marker) == 1
          s = s.replace(marker, marker + entry, 1)
          p.write_text(s, encoding='utf-8')
          print('pass applied')
          PY

          chmod +x .github/scripts/verify_docs.py

          echo "--- checks ---"
          python3 .github/scripts/verify_docs.py .
          python3 .github/scripts/verify_apk.py .
          grep -E '^[0-9a-f]{64}  LiquidWeather\.apk$' CHECKSUMS.txt | sha256sum -c -
          python3 - <<'PY'
          import re
          s = open('web/index.html', encoding='utf-8').read()
          open('/tmp/page.js', 'w', encoding='utf-8').write(
              max(re.findall(r'<script[^>]*>(.*?)</script>', s, re.S), key=len))
          PY
          node --check /tmp/page.js
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/build.yml')); print('build.yml parses')"

      - name: Prove the new check catches the old README
        run: |
          set -e -o pipefail
          mkdir -p /tmp/old
          cp LiquidWeather.apk CHECKSUMS.txt /tmp/old/
          git show HEAD:README.md > /tmp/old/README.md
          if python3 .github/scripts/verify_docs.py /tmp/old; then
            echo "ERROR: the check passed on the pre-fix README; it would not have caught this." >&2
            exit 1
          fi
          echo "the pre-fix README is rejected, as it should be"

      - name: Commit the pass
        run: |
          set -e -o pipefail
          git config user.name "Liquid Weather maintenance"
          git config user.email "maintenance@liquidweather.app"
          git add -A
          git commit -q -F - <<'MSG'
          fix(docs): publish the digest the repository actually ships

          README.md's verification block told every downloader to expect f8a52080…, the
          1.7 APK, while CHECKSUMS.txt, the committed LiquidWeather.apk and every release
          since 1.8 carried 042f58b6… (the 1.9.1 build). A reader who ran the two commands
          as printed got "LiquidWeather.apk: FAILED" on a download that was exactly the
          file this repository publishes, which reads as a corrupted or tampered download.

          The same drift had reached the surrounding prose: README said "Latest APK: v1.7"
          (the latest release is v1.9) and 93 KB, and STORE.md said it matched release
          v1.2 and quoted 65 KB three times. The committed APK is 99,176 bytes (97 KB), so
          both files now name v1.9 and 97 KB, and the README prints the digest of the
          committed APK, identical to CHECKSUMS.txt.

          Why it stays fixed: the digest existed in three places and only two were
          checked. New .github/scripts/verify_docs.py reads it out of the README's
          "sha256sum LiquidWeather.apk" block and requires it to equal both CHECKSUMS.txt's
          digest and the SHA-256 of the committed APK; a README with no digest, two
          different digests, or a stray digest left in the prose fails. build.yml runs it
          beside the existing CHECKSUMS.txt and verify_apk.py steps, before anything is
          built.

          No page change: web/index.html is byte-identical to 1.9.1, so no APK rebuild, no
          versionCode bump and no CHECKSUMS.txt change. The day's release is still cut from
          the 22:00 IST pass.

          Verified: node --check on the page script; headless Chromium load with mocked
          forecast/geocoder/Commons reporting zero console and page errors; verify_docs.py
          exits 0 on this tree and 1 against the pre-fix README and against a stale
          CHECKSUMS.txt.
          MSG
          git push origin HEAD:main
