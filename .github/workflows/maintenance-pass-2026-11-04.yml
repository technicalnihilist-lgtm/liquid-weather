# One-off helper for the 2026-11-04 14:00 IST maintenance pass (area 8: search &
# geocoding). The sandbox that ran the audit can only read this repository, so
# the pass lands through CI: apply the audited edits, rebuild the APK with the
# project's own key, re-checksum it, commit, and remove this workflow again.
name: Maintenance pass (2026-11-04 14:00 IST)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-pass
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the pass's source edits
        run: python3 .github/maintenance/apply.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build, verify, commit and push
        run: |
          set -euo pipefail
          chmod +x android/build.sh
          ./android/build.sh | tee /tmp/build.log
          # same signing key as every previous build
          grep -q '2035d69f949e12e56728cc83964fb7fa663c40fa45765cb3b880dc08229e3b8b' /tmp/build.log
          # bundled copy identical to the source, in the tree and inside the APK
          cmp web/index.html android/assets/index.html
          unzip -p android/build/LiquidWeather.apk assets/index.html | cmp - web/index.html
          cp android/build/LiquidWeather.apk LiquidWeather.apk
          python3 .github/maintenance/checksums.py
          cp .github/maintenance/message.txt /tmp/message.txt
          rm -rf .github/maintenance .github/workflows/maintenance-pass-2026-11-04.yml
          git config user.name "Liquid Weather Maintenance"
          git config user.email "maintenance@liquidweather.local"
          git add -A
          git commit -F /tmp/message.txt
          git push origin HEAD:main
