name: Maint apply 2026-11-16 0000

# One-shot: applies the staged 00:00 pass patch, rebuilds the APK from the
# resulting tree, republishes it with a fresh CHECKSUMS.txt and README digest,
# verifies everything and commits the lot to main. Removes itself and the patch
# in that same commit, so it can only run once.

on:
  push:
    paths:
      - '.github/workflows/maint-apply-2026-11-16-0000.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maint-apply-2026-11-16-0000
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the pass patch
        run: |
          set -e
          git apply --whitespace=nowarn .github/maint/2026-11-16-0000.patch \
            || patch -p1 --fuzz=3 -l -i .github/maint/2026-11-16-0000.patch
          echo "patch applied"
          git diff --stat
          # The applied page must be byte for byte the page that was verified
          # before this pass was staged. A patch that half-applied or landed in
          # the wrong place fails here, before anything is built or committed.
          EXPECTED_PAGE=6cbb6208ef3a852703baa2c07db308f75a8c65fe2ceda979dfe7aaa8df6ef7d0
          GOT=$(sha256sum web/index.html | cut -d' ' -f1)
          echo "page $GOT"
          test "$GOT" = "$EXPECTED_PAGE"
          grep -q 'memory & lifecycle (2026-11-16, 00:00 IST pass)' CHANGELOG.md
          grep -q 'android:versionName="1.13.1"' android/AndroidManifest.xml
          grep -q 'android:versionCode="77"' android/AndroidManifest.xml
          grep -q 'function watchDPR()' web/index.html
          grep -q "matchMedia('(resolution: '" web/index.html
          echo "applied tree verified"

      - name: Copy the page into the Android assets
        run: |
          set -e
          cp web/index.html android/assets/index.html
          cmp web/index.html android/assets/index.html
          echo "assets copy verified"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build-tools
        run: |
          set -e
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build the signed APK
        run: |
          set -e
          chmod +x android/build.sh
          ./android/build.sh

      - name: Publish the APK and its digests
        run: |
          set -e
          cp android/build/LiquidWeather.apk LiquidWeather.apk
          OLD=$(grep -oE '^[0-9a-f]{64}' CHECKSUMS.txt)
          NEW=$(sha256sum LiquidWeather.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s LiquidWeather.apk)
          KB=$(python3 -c "print(round($SIZE/1024))")
          echo "old digest $OLD"
          echo "new digest $NEW"
          echo "size $SIZE bytes, $KB KB"
          test -n "$OLD"
          test "$OLD" != "$NEW"
          sed -i "s/$OLD/$NEW/g" CHECKSUMS.txt README.md
          # The changelog names the digest in prose too, abbreviated. Keep it
          # true for the APK this run actually publishes.
          SHORT=$(echo "$NEW" | cut -c1-8)
          sed -i "s/82fc6f8a\xe2\x80\xa6/${SHORT}\xe2\x80\xa6/g" CHANGELOG.md
          grep -n "$SHORT" CHANGELOG.md
          if [ "$KB" != "105" ]; then
            sed -i "s/105 KB/$KB KB/g" README.md STORE.md
            echo "size figures moved to $KB KB"
          else
            echo "size figures unchanged at 105 KB"
          fi
          grep -n "$NEW" CHECKSUMS.txt README.md

      - name: Verify before committing
        run: |
          set -e
          grep -E '^[0-9a-f]{64}  LiquidWeather\.apk$' CHECKSUMS.txt | sha256sum -c -
          python3 .github/scripts/verify_apk.py .
          python3 .github/scripts/verify_docs.py .
          unzip -p LiquidWeather.apk assets/index.html | sha256sum
          sha256sum web/index.html

      - name: Commit and push
        run: |
          set -e
          git config user.name "Liquid Weather maintenance"
          git config user.email "maint@liquidweather.local"
          git rm -q .github/workflows/maint-apply-2026-11-16-0000.yml .github/maint/2026-11-16-0000.patch
          git add -A
          git commit -q -F - <<'MSG'
          fix(lifecycle): re-fit the particle canvas when the pixel ratio changes

          #fx's backing store is built in size() from the box's CSS size times
          devicePixelRatio, and size() only runs from resize and orientationchange.
          Neither fires when the ratio changes and the CSS box does not - dragging
          the page to a display with a different scaling factor, or changing the OS
          display-scale setting - so the store kept the ratio it was built with and
          every drop was drawn against it. At a 430x900 box the store stayed
          860x1800 after the ratio went 2 -> 1: the rain field was rasterised at
          twice the density and displayed at half size, each drop half as long and
          half as thick as it should be, and the other way round at double size and
          soft. It stayed that way until the next real resize, including across a
          scene change, because startFx() re-fits a released canvas from the same
          stale W/H/DPR.

          The page now watches the one signal it was not listening for: a
          (resolution: <dpr>dppx) media query, armed at load and re-armed for the
          new ratio after each change, with the same addEventListener/addListener
          fallback the reduce-motion query uses. It only re-runs size(), which
          already returns untouched when the measurement it takes is the one it
          has, so a spurious fire costs one getBoundingClientRect() and a real one
          re-fits the store and re-seeds the field exactly as a resize does.

          No visual or behavioural change: with the ratio unchanged, #main's markup
          hash, its length, the node count, the #fx store and the
          --k/--glass/--blur/--dp/--pr/--cc variables are identical to 1.13, as are
          the computed styles of the bar, hero, hero temperature, card, hourly
          strip, day row, grid card, nav, pill, canvas and phone. Proven by
          dropping the ratio 2 -> 1 at an unchanged box: 1.13 keeps an 860x1800
          store, this build re-fits to exactly 430x900 when the query fires and
          back to 860x1800 when the ratio returns; the handler runs once per
          signal, and after 100 re-arms the heap is flat.

          Version bumped to 1.13.1 (versionCode 77), same signing key; the APK
          rebuilt from this tree by android/build.sh bundles the same page and its
          signer digest is checked by that script; CHECKSUMS.txt and the README
          carry its digest.
          MSG
          git log --oneline -1
          git push origin main
          git rev-parse HEAD
