<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Liquid Weather</title>
<style>
:root{--tx:#fff;--tx2:rgba(255,255,255,.72);--glass:rgba(255,255,255,.08);--edge:rgba(255,255,255,.55);--edge2:rgba(255,255,255,.08);--sh:rgba(0,0,0,.22);--cc:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--glass:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0a0b14;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
.phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;overflow:hidden;background:#000}
@media(min-width:500px){.phone{height:min(880px,96%);border-radius:48px;box-shadow:0 0 0 10px #15161d,0 30px 80px rgba(0,0,0,.6)}}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}.bg.on{opacity:1}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;opacity:0;transition:opacity 1.2s}
#sun{width:220px;height:220px;top:-40px;right:-30px;background:radial-gradient(circle,#fff8c9 0 22%,rgba(255,226,110,.75) 38%,rgba(255,200,60,0) 70%);animation:pulse 6s ease-in-out infinite alternate}
#moon{width:78px;height:78px;top:80px;right:26px;background:#f4f1de;box-shadow:inset -16px -6px 0 0 #cfcab0,0 0 60px 14px rgba(230,230,255,.4)}
@keyframes pulse{to{transform:scale(1.12)}}
#clouds{transition:opacity 1.2s}
.cloud{position:absolute;height:60px;border-radius:50%;background:var(--cc);filter:blur(16px);animation:drift linear infinite;transition:background 1.2s,opacity 1.2s;will-change:transform}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:50%;height:120%;left:14%;top:-60%}.cloud::after{width:40%;height:100%;right:12%;top:-40%}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(560px)}}
#fx{position:absolute;inset:0;width:100%;height:100%}
#flash{position:absolute;inset:0;background:#dfe6ff;opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.cloud,#sun{animation:none}}
.glass{position:relative;isolation:isolate;background:linear-gradient(145deg,rgba(255,255,255,calc(.20*var(--k,1))),rgba(255,255,255,calc(.04*var(--k,1))) 48%,rgba(255,255,255,calc(.10*var(--k,1)))),var(--glass);backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.06),0 12px 36px var(--sh),0 1px 3px rgba(0,0,0,.08)}
main{position:absolute;inset:0;overflow-y:auto;padding:22px 16px 118px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.u{height:34px;padding:0 14px;border-radius:17px;border:0;color:var(--tx);font:inherit;font-weight:800;font-size:14px;cursor:pointer;flex:none}
.loc{font-size:15px;font-weight:700;opacity:.9;display:flex;align-items:center;gap:5px;min-width:0;border:0;background:none;color:inherit;font-family:inherit;padding:0;cursor:pointer;text-align:left}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{text-align:center;padding:26px 0 24px}
.hero h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.temp{font-size:112px;font-weight:200;line-height:1;letter-spacing:-.04em;margin:2px 0 0 14px;text-shadow:0 6px 30px rgba(0,0,0,.18)}
.cond{font-size:21px;font-weight:600}.hl{font-size:18px;font-weight:500;opacity:.85;margin-top:4px}
.card{border-radius:26px;padding:14px 16px;margin-bottom:12px}
.lbl{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--edge2)}
.sum{font-size:15px;line-height:1.4}
.hrs{display:flex;gap:6px;overflow-x:auto;margin:0 -6px;scrollbar-width:none}.hrs::-webkit-scrollbar{display:none}
.hr{flex:none;width:56px;text-align:center;padding:6px 0}.hr span{display:block;font-size:13px;font-weight:600}.hr i{font-style:normal;font-size:26px;display:block;margin:8px 0}.hr b{font-size:17px}
.day{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge2)}.lbl+.day{border-top:0}
.day em{width:52px;font-style:normal;font-weight:600;font-size:16px}.day i{font-style:normal;width:30px;font-size:22px;text-align:center}
.day small{width:34px;text-align:right;font-size:16px;font-weight:600}.day small.lo{color:var(--tx2)}
.rng{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.2);position:relative}.rng span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7fd6ff,#ffd86b,#ff9a5a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;min-height:128px}
.grid b{display:block;font-size:34px;font-weight:500;margin:4px 0 8px}.grid span{font-size:13px;color:var(--tx2);line-height:1.35;display:block}
/* nav: see motion layer below */





:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* ---- search sheet ---- */
/* sheet: see motion layer below */

.sh-top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.sh-in{flex:1;height:46px;border-radius:23px;border:0;background:var(--glass);color:var(--tx);font:inherit;font-size:16px;font-weight:600;padding:0 18px;outline:0;box-shadow:inset 1.5px 1.5px 1px var(--edge),inset -1px -1px 1px var(--edge2)}
.sh-in::placeholder{color:var(--tx2);font-weight:500}
.sh-x{width:46px;height:46px;flex:none;border-radius:23px;border:0;background:var(--glass);color:var(--tx);font-size:20px;cursor:pointer;box-shadow:inset 1.5px 1.5px 1px var(--edge)}
.sh-list{flex:1;overflow-y:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.sh-list::-webkit-scrollbar{display:none}
.sh-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:14px 4px 8px}
.sh-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--glass);color:var(--tx);font:inherit;padding:12px 14px;border-radius:18px;margin-bottom:8px;cursor:pointer;box-shadow:inset 1px 1px 1px var(--edge2)}
.sh-i:active{background:rgba(255,255,255,.24)}
.sh-i b{display:block;font-size:16px;font-weight:700}
.sh-i small{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px}
.sh-i .ic{font-size:20px;width:26px;text-align:center;flex:none}
.sh-i .rm{margin-left:auto;font-size:17px;color:var(--tx2);padding:6px 2px 6px 10px;flex:none}
.sh-empty{font-size:14px;color:var(--tx2);padding:18px 6px;line-height:1.5}
.sh-r{width:46px;flex:none;border-radius:18px;border:0;background:rgba(255,255,255,.1);color:var(--tx);font:inherit;font-size:19px;cursor:pointer;box-shadow:inset 1px 1px 1px var(--edge2)}
.sh-r:active{background:rgba(255,255,255,.24)}
.sh-loc{display:flex;align-items:center;gap:10px;width:100%;border:0;background:rgba(255,255,255,.1);color:var(--tx);font:inherit;font-weight:700;font-size:15px;padding:13px 16px;border-radius:18px;margin-bottom:6px;cursor:pointer;box-shadow:inset 1px 1px 1px var(--edge2)}
/* ---- toast / loading ---- */
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,26px) scale(.9);z-index:30;max-width:330px;padding:11px 16px;border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.35;text-align:center;background:rgba(20,22,34,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge2);opacity:0;pointer-events:none;transition:opacity .3s,transform .75s var(--spring)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.24),rgba(255,255,255,.13));background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel,.spin{animation:none}}

/* ================= spring motion + liquid glass layer ================= */
:root{--blur:22px;--spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.3,1.2,.5,1)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,0.017,0.064,0.134,0.22,0.316,0.418,0.521,0.621,0.716,0.803,0.881,0.949,1.006,1.052,1.089,1.116,1.134,1.144,1.148,1.146,1.139,1.129,1.117,1.103,1.088,1.073,1.058,1.044,1.031,1.019,1.009,1,0.993,0.987,0.983,0.981,0.979,0.978,0.978,0.979,0.981,1);--spring-soft:linear(0,0.009,0.034,0.071,0.117,0.171,0.229,0.29,0.353,0.415,0.477,0.536,0.593,0.646,0.696,0.742,0.785,0.823,0.858,0.889,0.916,0.939,0.96,0.977,0.992,1.004,1.014,1.022,1.028,1.032,1.035,1.037,1.038,1.038,1.038,1.037,1.035,1.033,1.031,1.029,1.026,1.024,1)}}

/* glass rim (specular edge) + sheen */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.10) 32%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 90% at 12% -10%,rgba(255,255,255,calc(.28*var(--k,1))),rgba(255,255,255,0) 52%),linear-gradient(0deg,rgba(255,255,255,calc(.06*var(--k,1))),rgba(255,255,255,0) 30%)}

/* press = squash, release = spring back */
.u,.loc,.sh-x,.sh-r,.sh-loc,.sh-i,.card,#nav button{touch-action:manipulation;transition:transform .7s var(--spring),background .25s,color .3s,box-shadow .3s}
.u:active,.sh-x:active,.sh-r:active{transform:scale(.86);transition-duration:.12s}
.loc:active{transform:scale(.93);transition-duration:.12s}
.sh-i:active,.sh-loc:active{transform:scale(.96);transition-duration:.12s}
.card:active{transform:scale(.982);transition-duration:.15s}
#nav button:active{transform:scale(.84);transition-duration:.12s}

/* page + content */
#main{transition:opacity .35s ease,transform .7s var(--spring)}
#main.loading{opacity:.5;transform:scale(.985)}
@keyframes enter{from{opacity:0;transform:translate3d(calc(var(--dir,1)*46px),20px,0) scale(.93)}}
@keyframes tempPop{from{opacity:0;transform:scale(.7);filter:blur(8px)}}
@keyframes popIn{from{opacity:0;transform:translateY(26px) scale(.9)}}
@keyframes iconPop{from{transform:translateY(3px) scale(.65)}}
.page.enter>*{animation:enter 1s var(--spring) backwards;animation-delay:calc(var(--i,0)*55ms)}
.page.enter>.grid{animation:none}
.page.enter .grid .card{animation:enter 1s var(--spring) backwards;animation-delay:calc((var(--g,0) + 5)*55ms)}
.page.enter .temp{animation:tempPop 1.1s var(--spring) .1s backwards}
.stagger>*{animation:popIn .9s var(--spring) backwards;animation-delay:calc(120ms + var(--i,0)*45ms)}

/* bottom nav — floating glass bar with a sliding liquid lens */
#nav{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:26;height:68px;border-radius:34px;overflow:hidden}
#navScroll{height:100%;padding:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
#navScroll::-webkit-scrollbar{display:none}
#track{position:relative;display:flex;gap:2px;height:100%;min-width:100%;width:max-content}
#navItems{display:contents}
#nav button{position:relative;z-index:1;flex:1 1 0;min-width:0;border:0;background:none;border-radius:28px;color:var(--tx2);font:inherit;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 4px;white-space:nowrap}
#nav button svg{width:24px;height:24px;display:block;transition:transform .7s var(--spring)}
#nav button span{font-size:10.5px;font-weight:700;letter-spacing:.01em}
#nav button.on svg{transform:translateY(-1px) scale(1.08)}
#nav button.on{color:#fff}
#nav button.on svg{animation:iconPop .8s var(--spring)}
#pill{position:absolute;top:0;bottom:0;left:0;width:0;z-index:0;border-radius:28px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.14));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -8px 14px -8px rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.2),0 6px 18px rgba(0,0,0,.2);
  transform:scale(var(--sx,1),var(--sy,1));
  transition:left .85s var(--spring),width .85s var(--spring),transform .65s var(--spring)}
#pill.snap{transition:none}
#pill.go{--sx:1.1;--sy:.9}
#pill.lift{--sx:1.1;--sy:1.12}

/* search sheet — springs up from the bottom, springs down on close */
#sheet{position:absolute;inset:0 0 -140px 0;z-index:20;display:flex;flex-direction:column;padding:22px 16px calc(162px + env(safe-area-inset-bottom,0px));
  background:rgba(10,12,22,.5);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  transform:translateY(104%) scale(.94);transform-origin:50% 100%;opacity:0;visibility:hidden;border-radius:36px 36px 0 0;
  transition:transform .7s var(--spring-soft),opacity .3s ease,visibility 0s linear .7s,border-radius .5s}
#sheet.open{transform:none;opacity:1;visibility:visible;border-radius:0;transition:transform .9s var(--spring-soft),opacity .25s ease,visibility 0s,border-radius .6s}

@media(prefers-reduced-motion:reduce){
  :root{--spring:ease;--spring-soft:ease}
  .page.enter>*,.page.enter .grid .card,.page.enter .temp,.stagger>*,#nav button.on i{animation:none!important}
}

/* ---- settings, drag, intro ---- */
.ub{display:flex;gap:8px;flex:none}
#navScroll{touch-action:pan-y}
#nav button.hov{color:#fff}
@keyframes navIn{from{opacity:0;transform:translateY(150px) scale(.7)}}
@keyframes navItem{from{opacity:0;transform:translateY(26px) scale(.55)}}
.intro #nav{animation:navIn 1.2s var(--spring) .2s backwards}
.intro #navItems>button{animation:navItem .95s var(--spring) backwards;animation-delay:calc(.5s + var(--n,0)*70ms)}
#scrim{position:absolute;inset:0;z-index:24;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .35s ease}
#scrim.open{opacity:1;pointer-events:auto}
#set{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:30px;padding:16px 18px 14px;
  background-color:rgba(18,20,34,.42);transform:translateY(130%) scale(.88);transform-origin:50% 100%;opacity:0;visibility:hidden;
  transition:transform .7s var(--spring),opacity .25s ease,visibility 0s linear .7s}
#set.open{transform:none;opacity:1;visibility:visible;transition:transform .95s var(--spring),opacity .25s ease,visibility 0s}
.set-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:18px;font-weight:800}
.set-h .u{height:32px}
.rowr{display:grid;grid-template-columns:1fr auto;align-items:center;font-weight:700;font-size:15px;margin-bottom:4px}
.rowr output{color:var(--tx2);font-size:14px;font-variant-numeric:tabular-nums}
.rowr small{grid-column:1/3;color:var(--tx2);font-size:12px;font-weight:500;margin-top:-2px}
#set input[type=range]{grid-column:1/3;-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;margin:0;outline:0;touch-action:pan-y}
#set input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.9) var(--p,50%),rgba(255,255,255,.22) var(--p,50%))}
#set input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.9) var(--p,50%),rgba(255,255,255,.22) var(--p,50%))}
#set input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .55s var(--spring)}
#set input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .55s var(--spring)}
#set input[type=range]:active::-webkit-slider-thumb{transform:scale(1.28)}
#set input[type=range]:active::-moz-range-thumb{transform:scale(1.28)}
#setReset{margin:8px 0 0;justify-content:center}
@media(prefers-reduced-motion:reduce){.intro #nav,.intro #navItems>button{animation:none!important}}

/* ---------- 4D depth & parallax ---------- */
:root{--mx:0;--my:0;--dp:1;--pr:1}
#bgs{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*7px),calc(var(--my)*var(--pr)*var(--dp)*7px),0) scale(1.08);transform-origin:50% 45%;will-change:transform}
#orbLayer{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*22px),calc(var(--my)*var(--pr)*var(--dp)*22px),0);will-change:transform}
#clouds{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*11px),calc(var(--my)*var(--pr)*var(--dp)*11px),0)}
#fx{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*14px),calc(var(--my)*var(--pr)*var(--dp)*14px),0);will-change:transform}
main{perspective:1000px}
main > .fade{transform-style:preserve-3d}
.card{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*-4px),calc(var(--my)*var(--pr)*var(--dp)*-4px),0) rotateX(calc(var(--my)*var(--pr)*var(--dp)*-1.5deg)) rotateY(calc(var(--mx)*var(--pr)*var(--dp)*1.5deg));transform-origin:50% 50%;backface-visibility:hidden}
nav{transform:translate3d(calc(var(--mx)*var(--pr)*var(--dp)*-9px),calc(var(--my)*var(--pr)*var(--dp)*-9px),0) translateZ(0)}
@media(prefers-reduced-motion:reduce){#bgs,#orbLayer,#clouds,#fx,.card,nav{transform:none}}
</style>
</head>
<body>
<div class="phone">
  <div id="bgs"></div>
  <div class="layer" id="orbLayer"><div class="orb" id="sun"></div><div class="orb" id="moon"></div><div id="clouds"></div></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="layer" id="flash"></div>
  <main id="main"></main>
  <nav class="glass" id="nav" aria-label="Main"><div id="navScroll"><div id="track"><div id="pill"></div><div id="navItems"></div></div></div></nav>

  <div id="sheet" role="dialog" aria-label="Search places" aria-hidden="true" inert>
    <div class="sh-top">
      <input class="sh-in" id="q" type="search" aria-label="Search city or country" placeholder="Search any city or country…" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
      <button class="sh-x" id="closeSheet" aria-label="Close search">✕</button>
    </div>
    <div class="sh-list" id="shList"></div>
  </div>

  <div id="scrim"></div>
  <div id="set" class="glass" role="dialog" aria-label="Glass and motion settings" aria-hidden="true" inert>
    <div class="set-h"><span>Glass &amp; motion</span><button class="u glass" id="setDone">Done</button></div>
    <!-- aria-label on each slider: <output> is a labelable element and sits
         before the range inside this wrapping <label>, so the label binds to the
         output and every slider was announced with no name at all. -->
    <label class="rowr"><span>Transparency</span><output id="o_tr"></output><input type="range" id="r_tr" min="0" max="100" aria-label="Transparency"><small>Higher = clearer glass</small></label>
    <label class="rowr"><span>Blur</span><output id="o_bl"></output><input type="range" id="r_bl" min="0" max="100" aria-label="Blur"></label>
    <label class="rowr"><span>Bounce</span><output id="o_bo"></output><input type="range" id="r_bo" min="0" max="100" aria-label="Bounce"><small>0 = smooth, 100 = very bouncy</small></label>
    <label class="rowr"><span>Depth</span><output id="o_dp"></output><input type="range" id="r_dp" min="0" max="100" aria-label="Depth"><small>3D separation between sky, clouds, cards and nav</small></label>
    <label class="rowr"><span>Parallax</span><output id="o_pr"></output><input type="range" id="r_pr" min="0" max="100" aria-label="Parallax"><small>Follows tilt, finger and scroll — 0 turns it off</small></label>

  </div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 *  Liquid Weather — live data from Open-Meteo (free, no key, no ads)  *
 * ------------------------------------------------------------------ */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- condition scenes (same palette as the design) ---------- */
const SCENES = {
  sun:   { name:'Clear',        bg:['#1e6fe0','#4fb4f5','#a8e2ff'], cc:'#fff',     co:.35, n:3, fx:'',      orb:'sun',
           nbg:['#050820','#121a4a','#2b2f77'], ncc:'#6a70b0', nco:.12, nn:2, nfx:'stars', norb:'moon' },
  cloud: { name:'Cloudy',       bg:['#56677d','#8393a8','#b4c0cf'], cc:'#e8edf3', co:.95, n:7, fx:'',      orb:'sun',
           nbg:['#0b1220','#1d2438','#333c52'], ncc:'#8b93a8', nco:.5,  nn:5, nfx:'',      norb:'' },
  fog:   { name:'Fog',          bg:['#6b7381','#94a0ad','#c3ccd6'], cc:'#eef2f6', co:.9,  n:4, fx:'',      orb:'',
           nbg:['#101422','#232a3c','#39415a'], ncc:'#a8b0c0', nco:.8,  nn:4, nfx:'',      norb:'' },
  rain:  { name:'Rain',         bg:['#243545','#3a566e','#5a7389'], cc:'#8a98a8', co:.95, n:7, fx:'rain',  orb:'',
           nbg:['#080c18','#16202f','#2a3a4d'], ncc:'#5a6675', nco:.9,  nn:6, nfx:'rain',  norb:'' },
  storm: { name:'Thunderstorm', bg:['#14142a','#2a2748','#473a63'], cc:'#4b4d68', co:.95, n:8, fx:'storm', orb:'',
           nbg:['#05060f','#161430','#2a2342'], ncc:'#3a3c55', nco:.9,  nn:7, nfx:'storm', norb:'' },
  snow:  { name:'Snow',         bg:['#5f7fa6','#a0b9d8','#dce8f5'], cc:'#f2f6fb', co:.8,  n:5, fx:'snow',  orb:'',
           nbg:['#131a2e','#28324f','#3e4a6b'], ncc:'#cfd8e8', nco:.6,  nn:5, nfx:'snow',  norb:'' }
};

/* ---------- WMO weather codes ---------- */
const WMO = {
  0:['Clear sky','sun'],            1:['Mainly clear','sun'],
  2:['Partly cloudy','cloud'],      3:['Overcast','cloud'],
  45:['Fog','fog'],                 48:['Freezing fog','fog'],
  51:['Light drizzle','rain'],      53:['Drizzle','rain'],        55:['Heavy drizzle','rain'],
  56:['Freezing drizzle','rain'],   57:['Freezing drizzle','rain'],
  61:['Light rain','rain'],         63:['Rain','rain'],           65:['Heavy rain','rain'],
  66:['Freezing rain','rain'],      67:['Freezing rain','rain'],
  71:['Light snow','snow'],         73:['Snow','snow'],           75:['Heavy snow','snow'],
  77:['Snow grains','snow'],
  80:['Light showers','rain'],      81:['Showers','rain'],        82:['Heavy showers','rain'],
  85:['Snow showers','snow'],       86:['Heavy snow showers','snow'],
  95:['Thunderstorm','storm'],      96:['Thunderstorm with hail','storm'],
  99:['Severe thunderstorm','storm']
};
const codeInfo = c => WMO[c] || ['Cloudy','cloud'];
function iconFor(code, isDay) {
  const d = !!isDay;
  /* A code with no entry in WMO is described as "Cloudy" and painted with the
     cloud scene. The range tests below used to claim it anyway: any code at or
     above 95 — including one Open-Meteo might start sending after a model
     change — was drawn as a thunderstorm next to "Cloudy" over a plain cloudy
     sky, and every code from 61 up was drawn as rain. Fall back to the same
     glyph the rest of the app falls back to. All 28 documented codes are in
     WMO, so nothing they render changes. */
  if (!WMO[code]) return '☁️';
  if (code === 0) return d ? '☀️' : '🌙';
  if (code === 1) return d ? '🌤️' : '🌙';
  if (code === 2) return d ? '⛅' : '☁️';
  if (code === 3) return '☁️';
  if (code === 45 || code === 48) return '🌫️';
  if (code >= 51 && code <= 57) return d ? '🌦️' : '🌧️';
  if (code >= 61 && code <= 67) return '🌧️';
  if (code >= 71 && code <= 77) return d ? '🌨️' : '❄️';
  if (code >= 80 && code <= 82) return d ? '🌦️' : '🌧️';
  if (code === 85 || code === 86) return '🌨️';
  if (code >= 95) return '⛈️';
  return '☁️';
}

/* ---------- units ---------- */
let F = LS.get('lw_unit', 'C') === 'F';
const T = c => Math.round(F ? c * 9 / 5 + 32 : c);
const wSpeed = kmh => Math.round(F ? kmh * 0.621371 : kmh);
const wUnit = () => F ? 'mph' : 'km/h';
const dist = m => F ? Math.round(m / 1609.34) : Math.round(m / 1000);
const distUnit = () => F ? 'mi' : 'km';
const hl = iso => {
  const h = +iso.slice(11, 13);
  const a = h >= 12 ? 'PM' : 'AM';
  return (h % 12 || 12) + ' ' + a;
};
const dayName = (iso, today) => iso === today ? 'Today'
  : new Date(iso + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' });

/* ---------- state ---------- */
/* Saved state is untrusted input: a quota error can truncate a write, an older
   build can leave a different shape behind, and anything can be edited by hand.
   Everything read back is validated here, because a single bad row used to take
   the whole app down at boot (places[cur] was undefined and the first render
   threw, leaving a blank screen). */
const MY_LOC = () => ({ id: 'loc', name: 'My Location', sub: '', lat: null, lon: null, myLoc: true });
const toNum = v => typeof v === 'number' ? v : (typeof v === 'string' && v.trim() !== '' ? +v : NaN);
function cleanPlace(p) {
  if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
  const myLoc = !!p.myLoc;
  let lat = toNum(p.lat), lon = toNum(p.lon);
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { lat = null; lon = null; }
  const name = typeof p.name === 'string' ? p.name.trim().slice(0, 80) : '';
  if (lat === null && !myLoc) return null;             // no coordinates and not "My Location": unusable
  const id = lat === null ? 'loc'
    : (typeof p.id === 'string' && p.id ? p.id : 'c' + lat.toFixed(3) + ',' + lon.toFixed(3));
  const out = { id, name: name || 'My Location', sub: typeof p.sub === 'string' ? p.sub.slice(0, 80) : '', lat, lon };
  if (myLoc) out.myLoc = true;

}
/* A coordinate of exactly 0 is a real coordinate (the equator, the prime
   meridian) but falsy: `!p.lat` read it as "no fix yet", so such a place was
   never fetched and the app showed the "Locating…" skeleton for ever. */
const hasFix = p => !!p && typeof p.lat === 'number' && typeof p.lon === 'number'
  && isFinite(p.lat) && isFinite(p.lon);
/* One validated list, at most one "My Location" row and five saved ones — the
   same ceiling addPlace() enforces. Every other field of a stored row was
   checked but the length of the list was not, so a restored or hand-edited
   `lw_places` of three thousand rows was accepted whole: opening the Cities
   sheet built 3,008 rows and blocked the main thread for 3.6s, and nothing
   reachable through the UI can produce more than six. */
function loadPlaces(raw) {
  const list = Array.isArray(raw) ? raw.map(cleanPlace).filter(Boolean) : [];
  let pinned = false, saved = 0;
  const capped = list.filter(p => {
    if (!p.myLoc) return ++saved <= 5;
    if (pinned) return false;
    pinned = true; return true;
  });
  return capped.length ? capped : [MY_LOC()];
}
let places = loadPlaces(LS.get('lw_places', null));
let curRaw = toNum(LS.get('lw_cur', 0));
let cur = isFinite(curRaw) ? Math.floor(curRaw) : 0;
cur = Math.max(0, Math.min(cur, places.length - 1));   // negative / huge / NaN indexes used to blank the app
const cache = {};          // id -> weather payload
let lastKey = '', dirNext = 1, showSeq = 0, fcCtl = null;
/* Elapsed time is measured on the monotonic clock, never on Date.now(). A
   device whose wall clock is corrected backwards — NTP catching up after a
   boot on a flat battery, or the user changing the clock — made a cached
   forecast look fresh for as long as the skew lasted, and stopped the ten-minute
   refresh from firing, so the app sat on one forecast until the clock caught up.
   performance.now() cannot run backwards. The forecast cache lives in memory
   for this session only, so every timestamp taken here is comparable.
   It is not the whole story, though: the monotonic clock does not tick while
   the device is asleep (Chrome reads CLOCK_MONOTONIC, which stops during
   suspend on Android and Linux), so a phone that slept through the night came
   back looking as if no time had passed at all — the ten-minute refresh saw
   "less than ten minutes since the last one" and skipped, the interval kept
   skipping, and the forecast on screen stayed hours old until ten minutes of
   *awake* time had gone by. Elapsed time is therefore the larger of the two
   clocks: the wall clock counts the hours spent asleep, the monotonic one
   still covers a wall clock that is corrected backwards, and both are compared
   against the same mark, so one correction can cost at most one extra fetch. */
const mono = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
const aged = (sinceMono, sinceWall, ms) => (mono() - sinceMono >= ms) || (Date.now() - sinceWall >= ms);
const STALE_MS = 10 * 60 * 1000;

const savePlaces = () => { LS.set('lw_places', places); LS.set('lw_cur', cur); };
/* Two documents share one saved list — the app and a browser tab, or two tabs.
   Each held its own copy in memory and wrote it out whole, so the tab that
   wrote last decided the list: tab A saved Mumbai, tab B (opened before that)
   saved Chennai, and Mumbai was gone at the next launch. A write made by
   another document arrives here as a `storage` event — never for this
   document's own writes, so a single tab behaves exactly as it did — and is
   adopted through the same validation a cold load uses, so the copies cannot
   drift apart and nothing one tab saved is thrown away by the other. */

  if (e.key !== 'lw_places' || e.newValue === null) return;   // a removed key is not a list
  let raw;
  try { raw = JSON.parse(e.newValue); } catch (_) { return; }  // not a list we can trust
  const next = loadPlaces(raw);
  const keep = places[cur] ? places[cur].id : null;
  places = next;
  pruneCache();                                 // rows the other tab deleted are not ours to hold
  const at = keep === null ? -1 : places.findIndex(p => p.id === keep);
  const still = at >= 0;
  cur = still ? at : Math.max(0, Math.min(cur, places.length - 1));
  nav();
  if (sheet.classList.contains('open')) paintSheet(qEl.value);  // saved rows only, results reused
  /* Repaint the page only when the city on screen is no longer in the list:
     adopting a list that still holds it must not replay the entry animation. */
  if (!still) {
    const p = places[cur];
    if (!hasFix(p)) { renderSkeleton(p); locate(); } else show(true);
  }
});

/* ---------- backgrounds & clouds (built once) ---------- */
const bgHost = $('#bgs');
bgHost.innerHTML = Object.keys(SCENES).map(k => {
  const s = SCENES[k];
  return `<div class="bg" id="bg-d-${k}" style="background:linear-gradient(180deg,${s.bg.join(',')})"></div>` +
         `<div class="bg" id="bg-n-${k}" style="background:linear-gradient(180deg,${s.nbg.join(',')})"></div>`;
}).join('');

const cloudHost = $('#clouds');
for (let i = 0; i < 9; i++) {
  const d = document.createElement('div');
  d.className = 'cloud';
  d.style.cssText = `width:${150 + Math.random() * 130}px;top:${20 + i * 52 + Math.random() * 30}px;animation-duration:${50 + Math.random() * 60}s;animation-delay:-${Math.random() * 80}s`;
  d.dataset.i = i;
  cloudHost.appendChild(d);
}

/* ---------- particle canvas ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let P = [], mode = '', W = 0, H = 0;
let DPR = 1, needClear = true;
/* A resize event does not mean the canvas changed size. A phone browser fires
   one every time its URL bar hides or the on-screen keyboard opens, and each one
   used to reassign canvas.width/height: that throws away and reallocates the
   whole backing store (430×900 at DPR 2 is about 3 MB of pixels), blanks the
   canvas and re-seeds every particle — for a box that had not moved. Nothing to
   do when the measurement is the one we already have. */
function size() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  /* canvas.width/height are unsigned longs, so the assignment below truncates:
     a 430px box at a device pixel ratio of 1.25 asks for 537.5 and the canvas
     keeps 537. Comparing the attribute with the fractional product never
     matched on any fractional ratio (Windows at 125% or 150% scaling, and any
     browser zoom), so every resize event reallocated the whole backing store —
     the exact work the guard above is there to avoid. Compare against the
     integer that is actually stored. */
  const bw = Math.trunc(w * dpr), bh = Math.trunc(h * dpr);
  if (w === W && h === H && dpr === DPR && cv.width === bw && cv.height === bh) return;
  DPR = dpr; W = w; H = h;
  cv.width = bw; cv.height = bh;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);

}
/* Every render() calls scene(), and scene() seeds the particles, so toggling
   °C/°F or the ten-minute refresh re-randomised every drop on screen — the
   whole field jumped to new positions under the reader's eyes — and allocated a
   fresh array of up to 260 objects each time. The particle set only needs
   rebuilding when the scene or the canvas itself changes. */
let seedKey = '';
function seed() {
  const k = mode + '|' + W + 'x' + H + '@' + DPR;
  if (k === seedKey) return;
  seedKey = k;
  const n = mode === 'storm' ? 260 : mode === 'rain' ? 170 : mode === 'snow' ? 110 : mode === 'stars' ? 90 : 0;
  P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, v: Math.random(), r: Math.random() * 2 + .6 }));
  needClear = true;
  startFx();
}
/* Reduce motion is watched rather than sampled: it was read once at load, so a
   device that switched the setting on (or off) while the app was in the
   background kept the answer it gave at launch. Rain, snow and stars went on
   animating for a reader who had asked the system for no motion, and a reader
   who turned the setting off never got the particles back — the loop had
   stopped and nothing restarted it. Every other animation in the app follows
   this query through CSS, so the particle field now follows it too. */
const motionMQ = matchMedia('(prefers-reduced-motion:reduce)');
let still = motionMQ.matches;
/* The particle loop re-armed itself unconditionally at the end of every frame, so
   it ran for the whole session even when there was nothing to draw: a clear,
   cloudy or foggy scene seeds no particles at all, yet the app kept waking the
   main thread on every animation frame (and with Reduce motion on it did that
   for ever after the canvas had been cleared once). Nothing stopped it while
   the page was hidden either — a WebView does not cancel rAF on its own. The
   loop now ends as soon as the canvas is blank and nothing is falling, and
   while the page is hidden, and starts again when a scene seeds particles, the
   canvas is resized, or the page comes back. Particle speeds, counts and
   timings are untouched. */
let fxRaf = 0;
const pageHidden = () => document.visibilityState === 'hidden';
function tick() {
  fxRaf = 0;
  if (P.length || needClear) { cx.clearRect(0, 0, W, H); needClear = false; }
  /* Each drop used to be its own beginPath/moveTo/lineTo/stroke, and each flake
     its own beginPath/arc/fill, with strokeStyle, lineWidth and fillStyle
     re-assigned inside the loop — 1 020 canvas calls for a 170-drop rain frame
     and 1 560 for a 260-drop thunderstorm, every frame. The geometry is
     identical; it is submitted as one path per frame and painted with one
     stroke/fill, so a rain frame costs 344 calls instead of 1 020 (measured in
     headless Chromium, same seeded field). Positions, speeds, counts, colours
     and line widths are untouched; stars keep a per-star fill because their
     alpha differs. */
  if (!still) {
    if (mode === 'rain' || mode === 'storm') {
      const base = mode === 'storm' ? 22 : 15;
      cx.strokeStyle = 'rgba(200,220,255,.5)'; cx.lineWidth = 1.2;
      cx.beginPath();
      for (const p of P) {
        cx.moveTo(p.x, p.y); cx.lineTo(p.x - 3, p.y + 14 + p.v * 8);
        p.y += base + p.v * 8; p.x -= 1.5;
        if (p.y > H) { p.y = -20; p.x = Math.random() * W; }
      }
      cx.stroke();
    } else if (mode === 'snow') {
      cx.fillStyle = 'rgba(255,255,255,.9)';
      cx.beginPath();
      for (const p of P) {
        const r = p.r + 1;
        cx.moveTo(p.x + r, p.y); cx.arc(p.x, p.y, r, 0, 7);
        p.y += .8 + p.v * 1.6; p.x += Math.sin(p.y / 30 + p.v * 6) * .6;
        if (p.y > H) { p.y = -6; p.x = Math.random() * W; }
      }
      cx.fill();
    } else if (mode === 'stars') {
      for (const p of P) {
        p.v += .02;
        cx.fillStyle = `rgba(255,255,255,${.35 + Math.abs(Math.sin(p.v + p.x)) * .65})`;
        cx.fillRect(p.x, p.y * .6, p.r, p.r);

let lt;
function lightning() {
  clearTimeout(lt);

  /* The visibility handler below stops this chain when the app goes away, but
     it can only stop a chain that exists at that moment. A forecast that
     finishes downloading after the reader has left — the city was tapped and
     the phone put down — runs scene(), which calls this function again, and
     the timer was re-armed for a page nobody is looking at: the backgrounded
     WebView kept waking every few seconds to start a 600ms flash animation on
     an invisible element, for as long as it stayed in the background, while the
     particle loop beside it correctly stayed stopped. Nothing to flash while
     the page is hidden; the handler starts the chain again on return. */
  if (pageHidden()) return;
  lt = setTimeout(() => {
    const f = $('#flash');
    if (f.animate) f.animate([{ opacity: 0 }, { opacity: .7 }, { opacity: .1 }, { opacity: .55 }, { opacity: 0 }], { duration: 600 });
    lightning();
  }, 2500 + Math.random() * 5000);
}
/* Away from the app there is nothing to paint and nothing to flash: stop the
   frame loop and the lightning chain, and pick both up again on return. */
document.addEventListener('visibilitychange', () => {
  if (pageHidden()) {
    if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = 0; }
    clearTimeout(lt);
  } else {
    startFx();
    lightning();
  }
});
/* Follow the setting itself. Switching it on clears the field with one last
   frame — the same blank canvas a launch with the setting on shows, rather than
   a frozen frame of rain — and switching it off starts the loop again. */
function onMotionChange(e) {
  still = !!e.matches;
  if (still) {
    needClear = true;
    if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = 0; }
    if (!pageHidden()) fxRaf = requestAnimationFrame(tick);
  } else {
    startFx();
  }
}
try {
  if (motionMQ.addEventListener) motionMQ.addEventListener('change', onMotionChange);
  else if (motionMQ.addListener) motionMQ.addListener(onMotionChange);
} catch (e) {}

/* ---------- apply a scene ---------- */
function scene(cond, isDay) {
  const key = SCENES[cond] ? cond : 'cloud';
  const s = SCENES[key];
  const day = !!isDay;
  mode = day ? s.fx : s.nfx;
  document.querySelectorAll('.bg').forEach(b => b.classList.toggle('on', b.id === 'bg-' + (day ? 'd-' : 'n-') + key));
  document.documentElement.style.setProperty('--cc', day ? s.cc : s.ncc);
  cloudHost.style.opacity = day ? s.co : s.nco;
  const n = day ? s.n : s.nn;
  document.querySelectorAll('.cloud').forEach(c => c.style.opacity = +c.dataset.i < n ? 1 : 0);
  const orb = day ? s.orb : s.norb;
  $('#sun').style.opacity = orb === 'sun' ? (key === 'cloud' ? .55 : 1) : 0;
  $('#moon').style.opacity = orb === 'moon' ? .95 : 0;
  seed(); lightning();
}

/* ---------- toast ---------- */
let tt;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('on'), ms || 3200);
}

/* ---------- focus across a re-render ----------
   render()/renderSkeleton()/renderError() replace the whole of #main, which
   destroys whatever had focus and drops it to <body>: toggling °C/°F or
   picking a city left keyboard and screen-reader users back at the top of the
   document. The id of the control that had focus is remembered for a few
   seconds (a short window, so a later background refresh can't steal focus)
   and put back on the new copy of the same control.
   The window is measured on the monotonic clock, like every other elapsed-time
   test in the app: it used to be compared with Date.now(), so a wall clock the
   network corrected backwards (a cold boot that guessed the date, a manual
   change) kept the "few seconds" window open for as long as the skew lasted and
   a background refresh ten minutes later moved focus out from under the reader
   — while a clock corrected forwards closed it before the re-render it was
   meant for and focus was dropped to <body> after all. */
let heldFocus = { id: '', until: 0 };
function holdFocusIn(sel) {
  const a = document.activeElement;
  if (!a || a === document.body || !a.id) return;
  const host = document.querySelector(sel);
  if (host && host.contains(a)) heldFocus = { id: a.id, until: mono() + 4000 };
}
function holdFocusOn(id) { if (id) heldFocus = { id, until: mono() + 4000 }; }
function applyHeldFocus() {
  const h = heldFocus; heldFocus = { id: '', until: 0 };
  if (!h.id || mono() > h.until) return;
  const a = document.activeElement;
  if (a && a !== document.body) return;            // focus is already somewhere real
  const el = document.getElementById(h.id);
  if (el && !el.closest('[inert]')) { try { el.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------- network ----------
   getJSON takes an optional caller signal so a request that is no longer wanted
   (the user moved to another city) can be cancelled instead of running to its
   timeout. A server that is merely busy — 408/425/429/5xx — gets exactly one
   more attempt after a short pause (honouring Retry-After, capped), because the
   free Open-Meteo tiers answer 429 under a burst; a request the server rejected
   (400/404) is never repeated, and neither is a network error or a timeout, so
   a genuinely offline device still fails at the normal deadline. */
const RETRYABLE = { 408: 1, 425: 1, 429: 1, 500: 1, 502: 1, 503: 1, 504: 1 };
async function getJSON(url, timeout, signal) {
  const ctl = new AbortController();
  const id = setTimeout(() => ctl.abort(), timeout || 12000);
  const relay = () => ctl.abort();
  if (signal) {
    if (signal.aborted) ctl.abort();
    else signal.addEventListener('abort', relay, { once: true });
  }

function renderError(p) {

  holdFocusIn('#main');
  $('#main').innerHTML = `<div class="page">

  </div>`;
  bindUnit();
  /* same control as on the forecast screen: without this the offline screen's
     city name was dead, so a user with no connection could not search for
     another city from it (only the Cities tab still worked) */
  const openBtn = $('#openSearch');
  if (openBtn) openBtn.onclick = openSheet;
  /* the retry card is the only way back online, so it has to be reachable
     without a pointer: role + tabindex + Enter/Space (no visual change). */
  const retry = $('#main').querySelector('.card');
  retry.setAttribute('role', 'button');
  retry.setAttribute('tabindex', '0');
  retry.onclick = () => show(true);
  retry.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); show(true); }

  applyHeldFocus();
}

const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function render(p, w) {
  const c = w.current, h = w.hourly, d = w.daily;
  const [desc, cond] = codeInfo(c.weather_code);
  const isDay = c.is_day === 1;
  scene(cond, isDay);

  const ti = todayIndex(w);
  const today = d.time[ti];
  const hiToday = Math.round(d.temperature_2m_max[ti]);
  const loToday = Math.round(d.temperature_2m_min[ti]);

  /* hourly — next 8 hours from now */
  const hi0 = hourIndex(w);
  const hours = Array.from({ length: 8 }, (_, k) => {
    const i = Math.min(hi0 + k, h.time.length - 1);
    const hc = h.weather_code[i], hd = h.is_day[i] === 1;
    const label = k === 0 ? 'Now' : hl(h.time[i]);
    return `<div class="hr"><span>${label}</span><i>${iconFor(hc, hd)}</i><b>${T(h.temperature_2m[i])}°</b></div>`;
  }).join('');

  /* 7-day */
  const lows = d.temperature_2m_min.map(v => v);
  const highs = d.temperature_2m_max.map(v => v);
  const mn = Math.min(...lows), mx = Math.max(...highs), span = Math.max(1, mx - mn);
  const days = d.time.map((iso, i) => {
    const lo = lows[i], hi = highs[i];
    const a = (lo - mn) / span * 100, b = (hi - mn) / span * 100;
    return `<div class="day"><em>${dayName(iso, today)}</em><i>${iconFor(d.weather_code[i], true)}</i>` +
      `<small class="lo">${T(lo)}°</small><div class="rng"><span style="left:${a.toFixed(1)}%;right:${(100 - b).toFixed(1)}%"></span></div>` +
      `<small>${T(hi)}°</small></div>`;
  }).join('');

  const uv = +(d.uv_index_max[ti] || 0);
  const uvT = uv >= 11 ? 'Extreme' : uv >= 8 ? 'Very high' : uv >= 6 ? 'High' : uv >= 3 ? 'Moderate' : 'Low';
  const gust = Math.round(c.wind_gusts_10m);
  const wind = Math.round(c.wind_speed_10m);
  const dew = h.dew_point_2m ? h.dew_point_2m[hi0] : null;
  const vis = h.visibility ? h.visibility[hi0] : null;
  const feels = c.apparent_temperature;
  const feelsNote = feels < c.temperature_2m - 1.5 ? 'Wind makes it feel cooler.'
    : feels > c.temperature_2m + 1.5 ? 'Humidity makes it feel warmer.'
    : 'Close to the actual temperature.';

  const rkey = p.id || (p.lat + ',' + p.lon);
  const anim = rkey !== lastKey;               // only bounce in when the city actually changed
  lastKey = rkey;
  holdFocusIn('#main');
  $('#main').classList.remove('loading');
  $('#main').innerHTML = `<div class="page${anim ? ' enter' : ''}">
  <div class="bar"><button class="loc" id="openSearch" title="Change city"><span>📍 ${esc(p.name)}${p.sub ? ', ' + esc(p.sub) : ''}</span></button><span class="ub"><button class="u glass" id="unit">°${F ? 'F' : 'C'}</button></span></div>
  <div class="hero"><h1>${esc(p.name)}</h1><div class="temp">${T(c.temperature_2m)}°</div><div class="cond">${esc(desc)}</div><div class="hl">H:${T(hiToday)}°  L:${T(loToday)}°</div></div>
  <div class="card glass"><div class="sum">${esc(summarise(w, cond, c.weather_code))}</div></div>
  <div class="card glass"><div class="lbl">🕐 Hourly forecast</div><div class="hrs">${hours}</div></div>
  <div class="card glass"><div class="lbl">📅 7-day forecast</div>${days}</div>
  <div class="grid">
    <div class="card glass"><div class="lbl">☀️ UV index</div><b>${uv.toFixed(0)}</b><span>${uvT}</span></div>
    <div class="card glass"><div class="lbl">💨 Wind</div><b>${wSpeed(wind)}</b><span>${wUnit()} · gusts ${wSpeed(gust)}</span></div>
    <div class="card glass"><div class="lbl">💧 Humidity</div><b>${Math.round(c.relative_humidity_2m)}%</b><span>${dew != null ? 'Dew point ' + T(dew) + '°' : 'Relative humidity'}</span></div>
    <div class="card glass"><div class="lbl">🌡️ Feels like</div><b>${T(feels)}°</b><span>${feelsNote}</span></div>
    <div class="card glass"><div class="lbl">👁️ Visibility</div><b>${vis != null ? dist(vis) : '–'}</b><span>${distUnit()} view range</span></div>
    <div class="card glass"><div class="lbl">⏲️ Pressure</div><b>${Math.round(c.pressure_msl)}</b><span>hPa</span></div>
  </div></div>`;

  bindUnit();
  $('#openSearch').onclick = openSheet;
  if (anim) prepEnter();
  applyHeldFocus();
}
function prepEnter() {
  const pg = $('#main .page');
  if (!pg) return;
  pg.style.setProperty('--dir', dirNext);
  [...pg.children].forEach((el, i) => el.style.setProperty('--i', i));
  pg.querySelectorAll('.grid .card').forEach((el, i) => el.style.setProperty('--g', i));
}
function replayEnter() {                       // used to preview the bounce setting
  const pg = $('#main .page');
  if (!pg) return;
  pg.classList.remove('enter'); void pg.offsetWidth; pg.classList.add('enter'); prepEnter();
}

function bindUnit() {
  const b = $('#unit');
  if (b) {
    // the button only ever shows "°C"/"°F", which reads badly aloud — give it
    // a spoken name that says what the button is (the visible label is unchanged)
    const unitName = () => 'Temperature unit: ' + (F ? 'Fahrenheit' : 'Celsius');
    b.setAttribute('aria-label', unitName());
    b.onclick = () => {
    F = !F;
    LS.set('lw_unit', F ? 'F' : 'C');
    b.textContent = '°' + (F ? 'F' : 'C');
    b.setAttribute('aria-label', unitName());
    const p = places[cur];
    const key = p.id || (p.lat + ',' + p.lon);
    if (hasFix(p) && cache[key]) render(p, cache[key]);
    };
  }
}

/* ---------- bottom nav: persistent buttons + sliding liquid lens ---------- */
const navEl = $('#nav'), navScroll = $('#navScroll'), navItems = $('#navItems'), pill = $('#pill');
let navSig = '', pillL = -1, pillW = -1, pillReady = false, goT;
const SV = d => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const TABS = [
  { id: 'home',   label: 'Weather', ic: SV('<path d="M7.5 18.5h9a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.4 9.6 4.5 4.5 0 0 0 7.5 18.5Z"/><path d="M12 3.2v1.3M5.2 6l.9.9M18.8 6l-.9.9" opacity=".7"/>') },
  { id: 'cities', label: 'Cities',  ic: SV('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>') },
  { id: 'set',    label: 'Glass',   ic: SV('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>') }
];
let tab = 'home';

function nav() {
  if (!navItems.children.length) {
    navItems.innerHTML = TABS.map((t, n) =>
      `<button data-tab="${t.id}" style="--n:${n}" aria-label="${t.label}">${t.ic}<span>${t.label}</span></button>`).join('');
  }
  navItems.querySelectorAll('button[data-tab]').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('on', on); b.classList.remove('hov');
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  placePill(false);
}
function setTab(t) {
  if (t === 'home') {
    if (tab === 'home') $('#main').scrollTo({ top: 0, behavior: 'smooth' });
    closeSheet(); closeSettings(); tab = 'home'; nav();
  } else if (t === 'cities') { closeSettings(); openSheet(); }
  else if (t === 'set') { closeSheet(); openSettings(); }
}

function placePill(snap, target) {
  const b = target || navItems.querySelector('button.on');
  if (!b || !b.offsetWidth) { pill.style.opacity = 0; return; }
  const L = b.offsetLeft, W = b.offsetWidth;
  pill.style.opacity = 1;
  if (L === pillL && W === pillW) return;       // already there (or already travelling there)
  if (snap || !pillReady) {
    pill.classList.add('snap');
    pill.style.left = L + 'px'; pill.style.width = W + 'px';
    void pill.offsetWidth;
    pill.classList.remove('snap');
  } else {
    pill.style.left = L + 'px'; pill.style.width = W + 'px';
    pill.classList.add('go'); clearTimeout(goT);
    goT = setTimeout(() => pill.classList.remove('go'), 220);
    if (navScroll.scrollWidth > navScroll.clientWidth + 1)
      navScroll.scrollTo({ left: 6 + L + W / 2 - navScroll.clientWidth / 2, behavior: 'smooth' });
  }
  pillL = L; pillW = W; pillReady = true;
}
if (window.ResizeObserver) new ResizeObserver(() => placePill(true)).observe($('#track'));

/* press and drag: the lens follows your finger across the cities */
let drag = null, justDragged = false;
const cityBtns = () => [...navItems.querySelectorAll('button[data-tab]')];
function nearestBtn(x) {
  let best = null, bd = 1e9;
  for (const b of cityBtns()) {
    const r = b.getBoundingClientRect(), d = Math.abs(x - (r.left + r.width / 2));
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
navEl.addEventListener('pointerdown', e => {
  pill.classList.add('lift');
  drag = { x: e.clientX, moved: false, b: null, id: e.pointerId };
});
navEl.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.abs(e.clientX - drag.x) < 8) return;
    drag.moved = true;
    try { navEl.setPointerCapture(drag.id); } catch (_) {}
  }
  const b = nearestBtn(e.clientX);
  if (b && b !== drag.b) {
    drag.b = b;
    cityBtns().forEach(x => x.classList.toggle('hov', x === b));
    placePill(false, b);
  }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  pill.classList.remove('lift');
  cityBtns().forEach(x => x.classList.remove('hov'));
  if (!d.moved) return;
  justDragged = true; setTimeout(() => { justDragged = false; }, 80);
  const t = d.b ? d.b.dataset.tab : tab;
  if (t !== tab) setTab(t); else nav();
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

function selectCity(i) {
  if (i === cur) { $('#main').scrollTo({ top: 0, behavior: 'smooth' }); return; }
  dirNext = i > cur ? 1 : -1;
  cur = i; savePlaces(); nav();
  $('#main').scrollTop = 0;
  const p = places[cur];
  if (!hasFix(p)) { renderSkeleton(p); locate(); } else show();
}

navEl.onclick = e => {
  if (justDragged) return;
  const b = e.target.closest('button');
  if (b && b.dataset.tab) setTab(b.dataset.tab);
};

/* ---------- search sheet ---------- */
const sheet = $('#sheet'), qEl = $('#q'), listEl = $('#shList');
let stT, qTimer, qSeq = 0, searchCtl = null;   // qSeq: every keystroke, open and close invalidates older searches
function openSheet() {
  tab = 'cities'; nav();
  sheet.classList.add('open');
  sheet.removeAttribute('inert');
  sheet.setAttribute('aria-hidden', 'false');
  /* the sheet covers the page, so take what it hides out of the tab order: Tab
     used to walk from the last result into the invisible city bar, unit button
     and forecast behind it. The nav stays live — it sits above the sheet and is
     how you leave it. */
  const mEl = $('#main');
  if (mEl) mEl.setAttribute('inert', '');
  qSeq++;                     // a search started before the sheet opened must not paint into it
  qEl.value = '';
  paintSheet('');
  listEl.classList.add('stagger');
  [...listEl.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 12)));
  clearTimeout(stT); stT = setTimeout(() => listEl.classList.remove('stagger'), 1400);
  try { qEl.focus({ preventScroll: true }); } catch (e) {}   // inside the tap, so iOS opens the keyboard
}
function closeSheet() {
  clearTimeout(qTimer);        // a pending debounce would fire a search into a closed sheet
  qSeq++;                      // and a request already in flight must not repaint the sheet later
  /* qSeq only stopped a late answer from being *painted*: the download it was
     waiting for kept running to its 9s deadline, and on to the second
     geocoder after that. Dropping the request itself is the point. */
  if (searchCtl) { searchCtl.abort(); searchCtl = null; }
  if (tab === 'cities') { tab = 'home'; nav(); }
  const hadFocus = sheet.contains(document.activeElement);   // focus would land on <body> once the panel goes inert
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  sheet.setAttribute('inert', '');
  const mEl = $('#main');
  if (mEl) mEl.removeAttribute('inert');        // before focusing, or the focus call is ignored
  qEl.blur();
  if (hadFocus) {
    const back = $('#openSearch');
    if (back) {
      try { back.focus({ preventScroll: true }); } catch (e) {}
      /* the newly picked city's forecast is still loading and will replace
         this button, so ask the render to put focus back on it */
      holdFocusOn(back.id);
    }
  }
}
$('#closeSheet').onclick = closeSheet;

/* Matching compared the accented characters themselves, so the bundled list
   could not be found by the name people actually type: "bogota", "sao paulo",
   "cancun" and "turkiye" all answered "No place called …" although Bogotá,
   São Paulo, Cancún and Türkiye sit in POPULAR — and with the geocoder
   unreachable that message was the only answer the sheet could give. Both
   sides are folded to plain letters before comparing; the name that is
   displayed keeps its accents. */
const fold = s => {

    const name = fold(c[0]), country = fold(c[1]);
    return name.startsWith(s) || country.startsWith(s) ||
      name.split(/[\s-]+/).some(word => word.startsWith(s));
  }).slice(0, 8).map(c => ({ name: c[0], sub: c[1], lat: c[2], lon: c[3] }));

/* Every place is keyed by pid(), which rounds the coordinates to three decimals
   (~110 m), so a city saved from the bundled list was not recognised when a
   geocoder answered for it. The bundled Mumbai sits at 19.076, 72.8777 and the
   same city from the fallback geocoder at 19.0550, 72.8692 — different keys, so
   the result row offered "add" instead of "saved", tapping it saved Mumbai a
   second time and the Cities sheet listed it twice, two of the five slots for
   one place. Two rows are the same place when their keys match, or when their
   folded names match and they lie within 25 km of each other: that covers every
   bundled city against both geocoders (Bundled/Nominatim offsets measured at
   0.6-10 km) while keeping same-named cities in different regions — Portland,
   two Springfields — apart. */
const SAME_KM = 25;

  if (a.id && b.id && a.id === b.id) return true;
  if (pid(a) === pid(b)) return true;
  const na = fold(a.name || ''), nb = fold(b.name || '');
  if (!na || na !== nb) return false;
  const dLat = (a.lat - b.lat) * 111.32;
  const dLon = (a.lon - b.lon) * 111.32 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);

function row(o) {

     carry data-rm="-1" that nothing read, so it announced "Remove" and did
     nothing at all. */
  const idx = places.findIndex(p => samePlace(p, o));
  const right = idx >= 0
    ? `<span class="rm" data-rm="${idx}" role="button" tabindex="0" aria-label="Remove ${esc(o.name)}">✕</span>` : '';
  const isSaved = idx >= 0;
  return `<button class="sh-i" data-lat="${o.lat}" data-lon="${o.lon}" data-name="${esc(o.name)}" data-sub="${esc(o.sub || '')}">

     the city that had just been deleted. */

  const saved = places.filter(hasFix);

/* A geocoder can answer 200 with a row that carries no coordinates at all, or
   with them as strings. dedupe() keys every row by pid(), which calls
   toFixed(), so one such row threw inside search() — outside every try — and
   the promise rejected: the sheet stayed on "Searching…" for good and the
   typed query could never be completed. Rows are normalised and checked here,
   before dedupe(), row() or addPlace() ever see them. */
const usableResult = o => !!o && typeof o.name === 'string' && o.name.trim() !== ''
  && typeof o.lat === 'number' && typeof o.lon === 'number'
  && isFinite(o.lat) && isFinite(o.lon) && Math.abs(o.lat) <= 90 && Math.abs(o.lon) <= 180;

async function remoteSearch(term, signal) {

    const subOf = r => {
      const bits = [];
      if (r.admin1 && r.admin1 !== r.country) bits.push(r.admin1);
      const c = r.country || r.country_code || '';
      if (c) bits.push(c);
      if (!bits.length && r.admin2) bits.push(r.admin2);
      return bits.join(', ');
    };
    const rows = Array.isArray(j.results) ? j.results : [];
    const list = rows.filter(r => r && typeof r === 'object').map(r => ({

     request threw out of the try above and fell straight through to the
     fallback, which fired a fresh Nominatim request — for a search nobody was
     waiting for any more. */
  if (signal && signal.aborted) return [];
  try {
    const j = await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q=' + encodeURIComponent(term), 9000, signal);
    return (Array.isArray(j) ? j : []).filter(r => r && typeof r === 'object').map(r => {

function dedupe(list) {

  const out = [];

  return out;

function countryMatches(term) {
  const t = fold(term);
  return POPULAR.filter(c => fold(c[1]).startsWith(t) && fold(c[0]) !== t)
    .slice(0, 6).map(c => ({ name: c[0], sub: c[1], lat: c[2], lon: c[3] }));

async function search(q) {

     429, and a request for a query the reader had already replaced kept a
     radio awake for up to 18s (9s per geocoder). The older request is now
     cancelled, so only the query in the box is being asked about. */
  if (searchCtl) { searchCtl.abort(); searchCtl = null; }
  const term = q.trim();
  if (term.length < 2) { paintSheet(q, localMatches(term)); return; }
  const ctl = new AbortController();
  searchCtl = ctl;

  /* Belt and braces: whatever a geocoder hands back, the sheet must never be
     left on "Searching…". */

       with a combining dot — so it never matched the bundled "Istanbul" and the
       sheet listed the same city twice. */
    const names = new Set(list.map(o => fold(o.name)));
    list = [...byCountry.filter(o => !names.has(fold(o.name))), ...list];
  }
  if (!list.length) list = localMatches(term);          // offline / no match fallback
  if (seq !== qSeq) return;                             // a newer keystroke won
  paintSheet(q, list.slice(0, 10));

  for (const key of Object.keys(SET_DEF)) {

    tiltAsked = true;
    const ask = async () => {
      try { if (await DeviceOrientationEvent.requestPermission() === 'granted') listenTilt(); } catch (e) {}
      document.removeEventListener('pointerdown', ask);

  mainEl.addEventListener('scroll', () => {

    queue();
  }, { passive: true });

  /* Follow the setting itself, both ways, the way the particle field does. */
  try {
    const follow = e => { if (e.matches) halt(); else resume(); };

};
$('#main').addEventListener('click', e => { if (e.target.closest('#gear')) openSettings(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && setEl.classList.contains('open')) closeSettings(); });
applySettings(); paintSettings();   // paint sliders at boot, not only when the panel opens

/* ---------- boot ---------- */
document.body.classList.add('intro'); setTimeout(() => document.body.classList.remove('intro'), 2600);
document.addEventListener('touchstart', function () {}, { passive: true });   // enables :active press states on iOS
nav();
size();
addEventListener('resize', size);
addEventListener('orientationchange', () => setTimeout(size, 250));
startFx();

(function boot() {
  const p = places[cur];
  renderSkeleton(p);                            // bounce the app in right away, data follows
  if (!hasFix(p)) locate(true); else show(true);
})();

/* refresh when the tab comes back, and every 10 minutes */
let lastAuto = mono(), lastAutoWall = Date.now();
function autoRefresh() {
  if (document.visibilityState !== 'visible') return;
  if (!aged(lastAuto, lastAutoWall, STALE_MS)) return;
  lastAuto = mono(); lastAutoWall = Date.now();
  const p = places[cur];
  if (hasFix(p)) show(true);
}
document.addEventListener('visibilitychange', autoRefresh);
setInterval(autoRefresh, 60 * 1000);

/* keep the sun/moon above the clouds layer ordering stable on resize */
addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
});
</script>
</body>
</html>
